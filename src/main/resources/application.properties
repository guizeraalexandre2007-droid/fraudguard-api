spring.application.name=fraudguard-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fraudguard}
spring.datasource.username=${DB_USER:fraudguard}
spring.datasource.password=${DB_PASSWORD:fraudguard}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.swagger-ui.path=/swagger-ui.html
